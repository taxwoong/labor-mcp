name: 버그 신고 / Bug report
description: 도구가 오동작하거나, 응답이 이상하거나, 검색·파싱이 깨졌을 때
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        원천 사이트(law.go.kr · nlrc.go.kr) 개편으로 검색·파싱이 **조용히** 깨질 수 있습니다.
        "0건"이 나왔는데 실제로는 자료가 있는 것 같다 — 이런 것도 확신 없이 올려주세요.
        계산 결과의 금액·일수가 다른 경우에는 [계산 결과 이의] 템플릿을 써 주시면 더 빠릅니다.
  - type: dropdown
    id: tool
    attributes:
      label: 어느 도구인가요
      options:
        - labor_law_article (노동법령 조문·부칙·연혁)
        - moel_interpretation_search (고용노동부 행정해석·법제처 해석례)
        - labor_case_search (법원 노동판례)
        - nlrc_decision_search (노동위원회 판정례)
        - analyze_payroll (임금대장 분석)
        - design_pay_table (급여테이블 설계)
        - labor_resource (지식 리소스 열람)
        - 계산 도구 (check_minimum_wage · calc_* 8종)
        - 프롬프트 (review_employment_contract · review_work_rules)
        - 서버 기동 / 커넥터 연결 자체
        - 잘 모르겠음
    validations:
      required: true
  - type: textarea
    id: params
    attributes:
      label: 넘긴 파라미터
      description: 값 그대로 붙여주세요 (예 - law_name="근로기준법", article_no="60", mode="article")
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 vs 실제 결과
      description: |
        원천 사이트(law.go.kr · nlrc.go.kr)에서 직접 확인한 값이 있으면 함께 적어주시면
        원인 파악이 훨씬 빠릅니다. "검색 0건"이라면 그 자료가 실제로 존재한다는 근거
        (문서번호·사건번호)를 함께 주세요.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 언제 발생했나요
      description: 원천 사이트 개편 시점 추정에 씁니다.
      placeholder: 예 - 2026-09-01
  - type: textarea
    id: env
    attributes:
      label: 실행 환경
      description: "파이썬 버전, OS, LAW_API_OC 설정 여부(IP 등록 여부 포함), 접속 방식(로컬 / 커넥터)"
      placeholder: "Python 3.12, Windows 11, LAW_API_OC 설정함(IP 등록 완료), claude.ai 커넥터"
